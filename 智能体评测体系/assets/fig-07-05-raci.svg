<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 690" width="980" height="690" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Source Han Sans SC, sans-serif">
  <rect x="0" y="0" width="980" height="690" fill="#FFFFFF"/>

  <text x="30" y="32" font-size="18" font-weight="700" fill="#212529">RACI 职责矩阵：谁写任务、谁修评分器、谁签字放行</text>
  <text x="30" y="53" font-size="12.5" fill="#868E96">核心分工：平台与基础设施归测试开发，评测任务归最懂业务的人——把「定义什么是好」的权力交给业务方。</text>

  <!-- 图例 -->
  <g font-size="11.5">
    <circle cx="38" cy="74" r="9" fill="#12B886"/><text x="38" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">R</text>
    <text x="54" y="78" fill="#087F5B" font-weight="700">Responsible　动手干</text>
    <circle cx="228" cy="74" r="9" fill="#FA5252"/><text x="228" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">A</text>
    <text x="244" y="78" fill="#C92A2A" font-weight="700">Accountable　最终问责（每行唯一）</text>
    <circle cx="524" cy="74" r="9" fill="#4C6EF5"/><text x="524" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">C</text>
    <text x="540" y="78" fill="#1C3FAA" font-weight="700">Consulted　需被咨询</text>
    <circle cx="700" cy="74" r="9" fill="#ADB5BD"/><text x="700" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">I</text>
    <text x="716" y="78" fill="#868E96" font-weight="700">Informed　需被告知</text>
  </g>

