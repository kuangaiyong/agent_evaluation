  <!-- 底部要点 -->
  <text x="30" y="622" font-size="12" fill="#343A40"><tspan font-weight="700">要点一：</tspan>写评测任务的 R 是<tspan font-weight="700">测试工程师</tspan>而非平台团队。平台团队不该也不可能替所有业务线定义成功标准，它要做的是把贡献门槛降到「提一个 PR」。</text>
  <text x="30" y="644" font-size="12" fill="#343A40"><tspan font-weight="700">要点二：</tspan>每个评测集必须有明确的 Owner（A 列）。<tspan font-weight="700">没有归属的评测集会在三个月内腐烂</tspan>——任务失效没人下线，饱和了没人换血。</text>
  <text x="30" y="666" font-size="12" fill="#343A40"><tspan font-weight="700">要点三：</tspan>Judge 校准的 R 有两个（测试工程师 + 领域专家），这是刻意的——校准协议要求<tspan font-weight="700">双人独立盲法标注</tspan>，一个人做不了。</text>
</svg>
