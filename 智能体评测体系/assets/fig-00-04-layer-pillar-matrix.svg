<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" width="1120" height="790" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Source Han Sans SC, sans-serif">
  <rect x="0" y="0" width="1120" height="790" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="30" y="34" font-size="19" font-weight="700" fill="#212529">层 × 柱矩阵：评测覆盖度自查表</text>
  <text x="30" y="55" font-size="12.5" fill="#868E96">纵轴 = 评到什么颗粒度（五层） · 横轴 = 评哪个部件（四支柱） · 每格填的是「这一格该量什么」</text>

  <!-- 列表头 -->
  <g font-size="14" font-weight="700">
    <rect x="150" y="72" width="230" height="46" fill="#E7F0FF" stroke="#4C6EF5" stroke-width="2"/>
    <text x="265" y="101" text-anchor="middle" fill="#1C3FAA">柱一 · 模型与推理</text>

    <rect x="382" y="72" width="230" height="46" fill="#E6FCF5" stroke="#12B886" stroke-width="2"/>
    <text x="497" y="101" text-anchor="middle" fill="#087F5B">柱二 · 工具</text>

    <rect x="614" y="72" width="230" height="46" fill="#FFF4E6" stroke="#F59F00" stroke-width="2"/>
    <text x="729" y="101" text-anchor="middle" fill="#B54708">柱三 · 记忆</text>

    <rect x="846" y="72" width="244" height="46" fill="#F8F0FC" stroke="#AE3EC9" stroke-width="2"/>
    <text x="968" y="101" text-anchor="middle" fill="#862E9C">柱四 · 环境与交互</text>
  </g>

  <!-- ===== L5 价值层 ===== -->
  <rect x="30" y="122" width="118" height="120" fill="#4DABF7" stroke="#1864AB" stroke-width="2"/>
  <text x="89" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">L5 价值层</text>
  <text x="89" y="190" text-anchor="middle" font-size="11" fill="#E7F5FF">上线后</text>
  <text x="89" y="207" text-anchor="middle" font-size="11" fill="#E7F5FF">到底有没有用</text>

  <g font-size="11.5" fill="#343A40">
    <rect x="150" y="122" width="230" height="120" fill="#F5F8FF" stroke="#DEE2E6"/>
    <text x="164" y="146">· 输出采纳率</text>
    <text x="164" y="167">· 人工返工率 / 编辑距离</text>
    <text x="164" y="188">· 用户满意度 CSAT</text>
    <text x="164" y="209">· 点踩率与投诉分类</text>

    <rect x="382" y="122" width="230" height="120" fill="#F4FCF9" stroke="#DEE2E6"/>
    <text x="396" y="146">· 线上动作成功率</text>
    <text x="396" y="167">· 人工干预 / 接管率</text>
    <text x="396" y="188">· 动作回滚率</text>
    <text x="396" y="209">· 单动作线上成本</text>

    <rect x="614" y="122" width="230" height="120" fill="#FFFAF2" stroke="#DEE2E6"/>
    <text x="628" y="146">· 会话连续性满意度</text>
    <text x="628" y="167">· 重复提问率</text>
    <text x="628" y="188">· 上下文丢失投诉数</text>

    <rect x="846" y="122" width="244" height="120" fill="#FBF6FD" stroke="#DEE2E6"/>
    <text x="860" y="146">· 缺陷逃逸数</text>
    <text x="860" y="167">· 线上事故数与等级</text>
    <text x="860" y="188">· 净节省工时</text>
    <text x="860" y="209">· 单位价值成本</text>
  </g>

  <!-- ===== L4 系统层 ===== -->
  <rect x="30" y="244" width="118" height="120" fill="#74C0FC" stroke="#1C7ED6" stroke-width="2"/>
  <text x="89" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4A82">L4 系统层</text>
  <text x="89" y="312" text-anchor="middle" font-size="11" fill="#0B4A82">能不能稳定</text>
  <text x="89" y="329" text-anchor="middle" font-size="11" fill="#0B4A82">安全地上线</text>

  <g font-size="11.5" fill="#343A40">
    <rect x="150" y="244" width="230" height="120" fill="#F5F8FF" stroke="#DEE2E6"/>
    <text x="164" y="268">· pass^k 一致性</text>
    <text x="164" y="289">· 越狱抵抗率</text>
    <text x="164" y="310">· 提示注入抵抗率</text>
    <text x="164" y="331">· 有害内容率</text>
    <text x="164" y="352">· TTFT / 端到端延迟 P95</text>

    <rect x="382" y="244" width="230" height="120" fill="#F4FCF9" stroke="#DEE2E6"/>
    <text x="396" y="268">· 注入故障恢复率</text>
    <text x="396" y="289">· 限流 / 超时容忍度</text>
    <text x="396" y="310">· 重试风暴检测</text>
    <text x="396" y="331">· 工具调用数与 token 成本</text>

    <rect x="614" y="244" width="230" height="120" fill="#FFFAF2" stroke="#DEE2E6"/>
    <text x="628" y="268">· 记忆冲突与重复条目率</text>
    <text x="628" y="289">· 并发写入一致性</text>
    <text x="628" y="310">· 记忆污染注入抵抗</text>
    <text x="628" y="331">· 记忆更新传播延迟</text>

    <rect x="846" y="244" width="244" height="120" fill="#FBF6FD" stroke="#DEE2E6"/>
    <text x="860" y="268">· 护栏违规计数（应为 0）</text>
    <text x="860" y="289">· RBAC 越权率</text>
    <text x="860" y="310">· PII / 密钥外泄率</text>
    <text x="860" y="331">· 合规约束遵守率</text>
    <text x="860" y="352">· 环境重置纯净度</text>
  </g>

  <!-- ===== L3 场景层 ===== -->
  <rect x="30" y="366" width="118" height="120" fill="#A5D8FF" stroke="#228BE6" stroke-width="2"/>
  <text x="89" y="412" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4A82">L3 场景层</text>
  <text x="89" y="434" text-anchor="middle" font-size="11" fill="#0B4A82">真实链路</text>
  <text x="89" y="451" text-anchor="middle" font-size="11" fill="#0B4A82">能不能走通</text>

  <g font-size="11.5" fill="#343A40">
    <rect x="150" y="366" width="230" height="120" fill="#F5F8FF" stroke="#DEE2E6"/>
    <text x="164" y="390">· 长链路目标保持度</text>
    <text x="164" y="411">· 跨轮指代消解准确率</text>
    <text x="164" y="432">· 进度率 / 步骤成功率</text>
    <text x="164" y="453">· 长时程自我纠错率</text>

    <rect x="382" y="366" width="230" height="120" fill="#F4FCF9" stroke="#DEE2E6"/>
    <text x="396" y="390">· 跨系统编排正确率</text>
    <text x="396" y="411">· 中间结果传递正确率</text>
    <text x="396" y="432">· 依赖时序遵守度</text>
    <text x="396" y="453">· 先诊断后行动遵守率</text>

    <rect x="614" y="366" width="230" height="120" fill="#FFFAF2" stroke="#DEE2E6"/>
    <text x="628" y="390">· 长对话事实回忆准确率</text>
    <text x="628" y="411">· 跨任务状态继承正确率</text>
    <text x="628" y="432">· 轮间一致性（无自相矛盾）</text>
    <text x="628" y="453">· 开放域检索覆盖率</text>

    <rect x="846" y="366" width="244" height="120" fill="#FBF6FD" stroke="#DEE2E6"/>
    <text x="860" y="390">· 澄清提问精准度</text>
    <text x="860" y="411">· 信息收集轨迹合理性</text>
    <text x="860" y="432">· 轮数效率</text>
    <text x="860" y="453">· 环境变化下的自适应恢复</text>
  </g>

  <!-- ===== L2 任务层 ===== -->
  <rect x="30" y="488" width="118" height="120" fill="#D0EBFF" stroke="#339AF0" stroke-width="2"/>
  <text x="89" y="534" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4A82">L2 任务层</text>
  <text x="89" y="556" text-anchor="middle" font-size="11" fill="#0B4A82">单个任务</text>
  <text x="89" y="573" text-anchor="middle" font-size="11" fill="#0B4A82">能不能完成</text>

  <g font-size="11.5" fill="#343A40">
    <rect x="150" y="488" width="230" height="120" fill="#F5F8FF" stroke="#DEE2E6"/>
    <text x="164" y="512">· 计划质量 / 计划执行一致</text>
    <text x="164" y="533">· 政策前置查询率</text>
    <text x="164" y="554">· 依赖上下文询问率</text>
    <text x="164" y="575">· 无效步骤占比</text>

    <rect x="382" y="488" width="230" height="120" fill="#F4FCF9" stroke="#DEE2E6"/>
    <text x="396" y="512">· 工具序列正确率</text>
    <text x="396" y="533">  （节点 F1 / 边 F1）</text>
    <text x="396" y="554">· 冗余调用率</text>
    <text x="396" y="575">· 工具报错解读与纠正率</text>

    <rect x="614" y="488" width="230" height="120" fill="#FFFAF2" stroke="#DEE2E6"/>
    <text x="628" y="512">· 多跳检索 P / R / F1</text>
    <text x="628" y="533">· 时序推理检索 P / R / F1</text>
    <text x="628" y="554">· 任务内上下文保持率</text>
    <text x="628" y="575">· 记忆覆盖率（必需查询）</text>

    <rect x="846" y="488" width="244" height="120" fill="#FBF6FD" stroke="#DEE2E6"/>
    <text x="860" y="512">· 结果态校验通过率</text>
    <text x="860" y="533">· 禁止动作审计（安全门控）</text>
    <text x="860" y="554">· 产物存在性与格式合规</text>
    <text x="860" y="575">· 部分得分聚合分</text>
  </g>

  <!-- ===== L1 单元层 ===== -->
  <rect x="30" y="610" width="118" height="120" fill="#E7F5FF" stroke="#4DABF7" stroke-width="2"/>
  <text x="89" y="656" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4A82">L1 单元层</text>
  <text x="89" y="678" text-anchor="middle" font-size="11" fill="#0B4A82">原子能力</text>
  <text x="89" y="695" text-anchor="middle" font-size="11" fill="#0B4A82">行不行</text>

  <g font-size="11.5" fill="#343A40">
    <rect x="150" y="610" width="230" height="120" fill="#F5F8FF" stroke="#DEE2E6"/>
    <text x="164" y="634">· 指令遵循单点检查</text>
    <text x="164" y="655">· 输出格式合规率</text>
    <text x="164" y="676">· 拒答边界（该拒 / 不该拒）</text>
    <text x="164" y="697">· 已知未知校准</text>

    <rect x="382" y="610" width="230" height="120" fill="#F4FCF9" stroke="#DEE2E6"/>
    <text x="396" y="634">· 调用决策准确率（调不调）</text>
    <text x="396" y="655">· 工具选择准确率</text>
    <text x="396" y="676">· 参数名 F1 / 参数值准确率</text>
    <text x="396" y="697">· 工具检索 MRR / NDCG</text>

    <rect x="614" y="610" width="230" height="120" fill="#FFFAF2" stroke="#DEE2E6"/>
    <text x="628" y="634">· 单跳检索 P / R / F1</text>
    <text x="628" y="655">· 写入正确率</text>
    <text x="628" y="676">· 重复条目计数</text>
    <text x="628" y="697">· 检索延迟</text>

    <rect x="846" y="610" width="244" height="120" fill="#FBF6FD" stroke="#DEE2E6"/>
    <text x="860" y="634">· 单条护栏规则拦截率</text>
    <text x="860" y="655">· 权限校验正确率</text>
    <text x="860" y="676">· 工具错误消息可解释性</text>
    <text x="860" y="697">· 沙箱隔离有效性</text>
  </g>

  <!-- 底部说明 -->
  <text x="30" y="758" font-size="11.5" fill="#868E96">用法一 · 建评测集：逐格问「我这一格有任务吗」，全空的格子要么确认不适用，要么就是覆盖漏洞</text>
  <text x="30" y="778" font-size="11.5" fill="#868E96">用法二 · 失败归因：一次失败先定位到格子，再决定改提示词（柱一）、改工具 schema（柱二）、改记忆策略（柱三）还是改权限配置（柱四）</text>
</svg>
