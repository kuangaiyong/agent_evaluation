services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenteval
      POSTGRES_PASSWORD: agenteval
      POSTGRES_DB: agenteval
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenteval"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://agenteval:agenteval@db:5432/agenteval
      JWT_SECRET: change-me-in-prod-please
      LLM_API_BASE: ${LLM_API_BASE:-}          # 留空 = Mock Judge；配置后走真实 OpenAI 兼容裁判
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL:-qwen-max}
      JUDGE_DAILY_LIMIT_YUAN: ${JUDGE_DAILY_LIMIT_YUAN:-50}
      GATE_WEBHOOK_URL: ${GATE_WEBHOOK_URL:-}   # CI 门禁回调（回归结论）
      GATE_WEBHOOK_SECRET: ${GATE_WEBHOOK_SECRET:-}
      CLICKHOUSE_ENABLED: 
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: agenteval
      CLICKHOUSE_PASSWORD: agenteval
      CLICKHOUSE_DB: agenteval
      AUTO_EVAL_INTERVAL: "5"     # 在线评估轮询秒数
      KAFKA_BROKERS: kafka:9092   # 生产化：网关鉴权后发布队列，Worker 消费（留空=内联直连模式）
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"


  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    environment:
      CLICKHOUSE_DB: agenteval
      CLICKHOUSE_USER: agenteval
      CLICKHOUSE_PASSWORD: agenteval
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8123:8123"
      - "9000:9000"

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"]
      interval: 5s
      timeout: 8s
      retries: 24
    ports:
      - "9092:9092"

  collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    volumes:
      - ./deploy/collector.yaml:/etc/otelcol/config.yaml
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP

  worker:
    build: ./backend
    command: ["python", "-m", "app.kafka_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://agenteval:agenteval@db:5432/agenteval
      JWT_SECRET: change-me-in-prod-please
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL:-qwen-max}
      JUDGE_DAILY_LIMIT_YUAN: ${JUDGE_DAILY_LIMIT_YUAN:-50}
      KAFKA_BROKERS: kafka:9092
      CLICKHOUSE_ENABLED: true
      CLICKHOUSE_HOST: clickhouse
      KAFKA_TOPIC: agenteval-ingest
      KAFKA_GROUP: agenteval-worker
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8088:80"

volumes:
  pgdata:
  uploads:
  chdata:
